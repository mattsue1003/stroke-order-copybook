<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>筆順製作｜筆順寫字本產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEEF0;--panel:#fff;--ink:#23262A;--muted:#62686F;--line:#D5D8DC;--red:#C23B2E;--red-soft:#F8E6E3;
  --kai:"LXGW WenKai TC","標楷體","DFKai-SB",serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1A1C1F;--panel:#24272B;--ink:#ECEDEE;--muted:#A3A8AE;--line:#3A3E44;--red:#EE7A6C;--red-soft:#3A2826}}
:root[data-theme="dark"]{--bg:#1A1C1F;--panel:#24272B;--ink:#ECEDEE;--muted:#A3A8AE;--line:#3A3E44;--red:#EE7A6C;--red-soft:#3A2826}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;font-size:15px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{max-width:1180px;margin:0 auto;padding:20px 18px 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seal{width:50px;height:50px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 5px var(--red);flex:none}
.seal span{font-family:var(--kai);font-size:32px;color:#fff;line-height:1}
header h1{font-family:var(--kai);font-size:26px;margin:0;line-height:1.2}
header p{margin:0;color:var(--muted);font-size:13.5px}
header a{margin-left:auto;color:var(--red);font-weight:700;text-decoration:none;border:1.5px solid var(--red);border-radius:10px;padding:6px 14px}
main{max-width:1180px;margin:0 auto;padding:8px 18px 60px;display:grid;grid-template-columns:260px 1fr auto;gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.lbl{display:block;font-weight:500;font-size:14px;margin-bottom:6px}
.pick{display:flex;gap:8px}
.pick input{width:100%;font-family:var(--kai);font-size:28px;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:4px;background:transparent}
.pick button,.btn{border:1.5px solid var(--red);background:transparent;color:var(--red);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.fill{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.saved{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.saved button{font-family:var(--kai);font-size:22px;width:44px;height:44px;border:1.5px solid var(--line);border-radius:8px;background:transparent;cursor:pointer}
.saved button:hover{border-color:var(--red)}
.status{border-left:3px solid var(--red);background:var(--red-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin-bottom:14px}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.bigwrap{width:min(480px,100%);aspect-ratio:1;background:#fff;border:2px solid #D9534A;position:relative}
.bigwrap .guide{position:absolute;inset:0;width:100%;height:100%}
.bigwrap .gl{position:absolute;inset:0;width:100%;height:100%}
.bigwrap .gl path{cursor:pointer}
.bigwrap.picking .gl path:hover{fill:#FCE3E0}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cmp{display:flex;gap:10px;background:#fff;border-radius:10px;padding:10px;border:1px solid var(--line)}
.cmp figure{margin:0;text-align:center;font-size:12px;color:#62686F;display:flex;flex-direction:column;align-items:center}
.cmp .off{height:var(--h);width:auto;display:block}
.cols{display:flex;gap:6px;height:var(--h)}
.col{display:flex;flex-direction:column}
.col svg{width:calc(var(--h)/16);height:calc(var(--h)/16);display:block}
.empty{color:var(--muted);font-size:14px;padding:30px 10px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:980px){ main{grid-template-columns:1fr} .cmpcard{justify-self:center} }
</style>
</head>
<body>
<header>
  <div class="seal" aria-hidden="true"><span>製</span></div>
  <div><h1>筆順製作</h1><p>對照教育部筆順提示圖，把還沒有數字筆順的字排好順序，加入寫字本</p></div>
  <a href="index.html">回寫字本</a>
</header>
<main>
  <section class="card">
    <label class="lbl" for="ch">要製作的字</label>
    <div class="pick"><input id="ch" maxlength="2" autocomplete="off" placeholder="字"><button type="button" id="go">開啟</button></div>
    <p class="hint">輸入一個字後按「開啟」。</p>
    <span class="lbl" style="margin-top:18px">已製作的字</span>
    <div class="saved" id="saved"></div>
    <p class="hint" id="savedHint"></p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
      <button class="btn" type="button" id="dl">下載 custom.js</button>
    </div>
    <p class="hint">製作好的字會存在這台電腦的瀏覽器，寫字本馬上就能用。要讓其他人也能用，請下載 custom.js，取代網站上的 strokedata/custom.js。</p>
  </section>

  <section class="card stage">
    <div class="status" id="status" style="align-self:stretch">輸入一個字開始。</div>
    <div class="bigwrap" id="big"></div>
    <div class="tools">
      <button class="btn" type="button" id="pick">重新點選順序</button>
      <button class="btn" type="button" id="undo">上一步</button>
      <button class="btn" type="button" id="suggest">套用自動建議</button>
      <button class="btn" type="button" id="reset">還原</button>
      <button class="btn fill" type="button" id="save">確認無誤，加入寫字本</button>
      <button class="btn" type="button" id="del">刪除這個字</button>
    </div>
  </section>

  <section class="card cmpcard">
    <span class="lbl">一筆一筆對照</span>
    <div class="cmp" id="cmp" style="--h:480px"><div class="empty">開啟一個字後，<br>這裡會並排顯示<br>教育部筆順與目前的順序</div></div>
    <p class="hint">左邊是教育部提示圖，右邊是目前的順序，每一格要一模一樣。</p>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="strokedata/custom.js"></script>
<script src="stroke-common.js"></script>

const GUIDE='<svg class="guide" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="50" y1="0" x2="50" y2="100" stroke="#EFA9A2" stroke-width=".5" stroke-dasharray="2.4 2"/><line x1="0" y1="50" x2="100" y2="50" stroke="#EFA9A2" stroke-width=".5" stroke-dasharray="2.4 2"/></svg>';
let custom={}; try{ custom=JSON.parse(localStorage.getItem('stroke-custom')||'{}'); }catch(e){}
const fileCustom=window.CUSTOM_SD||{};
const store=()=>{ try{ localStorage.setItem('stroke-custom',JSON.stringify(custom)); }catch(e){} };
const toast=$('#toast'); let tt;
const say=m=>{ toast.textContent=m; toast.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>toast.classList.remove('show'),3000); };

let ch='', base=null, suggest=null, order=[], picking=false, picked=[];
const loaded={};
window.__SD=(c,d)=>{ loaded[c]={s:d.s,m:d.m}; };
window.__SRC=(c,d)=>{ loaded[c]={s:d.s,m:d.m,o:d.o,src:d.src}; };
function load(c,path){ return new Promise(r=>{ const s=document.createElement('script'); s.src=path+encodeURIComponent(c)+'.js'; s.onload=s.onerror=()=>r(); document.head.appendChild(s); }); }

function cur(){ return StrokeKit.reorder(base,order); }
function draw(){
  const big=$('#big');
  if(!base){ big.innerHTML=GUIDE; $('#cmp').innerHTML='<div class="empty">沒有可用的筆畫資料</div>'; syncBtns(); return; }
  if(picking){
    const pos={}; picked.forEach((i,k)=>pos[i]=k);
    const fill=base.s.map((_,i)=>i in pos?'#FDECEA':'#fff');
    const tmp={s:base.s,m:base.m};
    big.innerHTML=GUIDE+StrokeKit.bigSVG('pick:'+ch,tmp,{fill,labelText:i=>i in pos?String(pos[i]+1):''});
  } else big.innerHTML=GUIDE+StrokeKit.bigSVG('cur:'+ch+':'+order.join(','),cur(),{});
  big.classList.toggle('picking',picking);
  // 對照
  const d=cur(), n=d.s.length; let cols='';
  for(let c0=0;c0<n;c0+=16){ cols+='<div class="col">'; for(let k=c0;k<Math.min(n,c0+16);k++) cols+=StrokeKit.stepSVG(d,k).replace('<svg ','<svg role="img" aria-label="第'+(k+1)+'筆" '); cols+='</div>'; }
  const cmp=$('#cmp');
  cmp.innerHTML=(MOE.has(ch)?'<figure><img class="off" src="strokes/'+encodeURIComponent(ch)+'.png" alt="教育部「'+ch+'」筆順提示"><figcaption>教育部</figcaption></figure>':'<figure><div class="empty">教育部提示圖<br>沒有這個字</div></figure>')+'<figure><div class="cols">'+(picking?'<div class="empty">點選完所有筆畫<br>後會顯示</div>':cols)+'</div><figcaption>目前的順序</figcaption></figure>';
  syncBtns();
}
function syncBtns(){
  const has=!!base;
  $('#pick').disabled=!has; $('#reset').disabled=!has; $('#save').disabled=!has||picking;
  $('#undo').disabled=!picking||!picked.length;
  $('#suggest').disabled=!has||!suggest||picking;
  $('#del').style.display=custom[ch]?'':'none';
  $('#pick').textContent=picking?'取消點選':'重新點選順序';
}
function renderSaved(){
  const keys=Object.keys(custom);
  $('#saved').innerHTML=keys.map(c=>'<button type="button" data-c="'+c+'" aria-label="開啟「'+c+'」">'+c+'</button>').join('');
  $('#savedHint').textContent=keys.length?'共 '+keys.length+' 個字，點一下可以再修改。':'還沒有製作的字。';
}
async function open(c){
  c=Array.from((c||'').trim()).find(x=>/\p{Script=Han}/u.test(x))||'';
  if(!c){ say('請輸入一個國字'); return; }
  ch=c; $('#ch').value=c; picking=false; picked=[];
  history.replaceState(null,'','?ch='+encodeURIComponent(c));
  const st=$('#status');
  if(custom[c]||fileCustom[c]){
    const d=custom[c]||fileCustom[c]; base={s:d.s,m:d.m}; order=d.s.map((_,i)=>i); suggest=null;
    st.textContent='「'+c+'」已經製作過，可以再調整順序後重新儲存。';
  } else {
    if(!loaded[c]){
      if(OK.has(c)) await load(c,'strokedata/');
      else if(AVAIL.has(c)) await load(c,'strokedata/src/');
    }
    const d=loaded[c];
    if(!d){ base=null; st.textContent='「'+c+'」目前找不到可用的開源筆畫資料，暫時無法製作。'+(MOE.has(c)?'請改用寫字本的「教育部筆順圖」版。':''); draw(); return; }
    base={s:d.s,m:d.m}; order=d.s.map((_,i)=>i);
    suggest=d.o&&d.o.join(',')!==order.join(',')?d.o:null;
    if(OK.has(c)) st.textContent='「'+c+'」已經在寫字本裡，筆順和教育部一致，不需要製作。';
    else st.textContent='請對照右邊的教育部提示圖。順序不同時，按「重新點選順序」，依正確順序一筆一筆點大字；確認每一格都一樣後，按「確認無誤，加入寫字本」。'+(d.src==='mmah'?'這個字的資料來自依大陸筆順規範整理的開源資料，順序常和台灣不同，請特別仔細對照。':'');
  }
  draw();
}
$('#go').onclick=()=>open($('#ch').value);
$('#ch').addEventListener('keydown',e=>{ if(e.key==='Enter') open($('#ch').value); });
$('#saved').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) open(b.dataset.c); });
$('#pick').onclick=()=>{ picking=!picking; picked=[]; draw(); };
$('#undo').onclick=()=>{ picked.pop(); draw(); };
$('#reset').onclick=()=>{ picking=false; picked=[]; order=base.s.map((_,i)=>i); draw(); };
$('#suggest').onclick=()=>{ if(suggest){ order=suggest.slice(); draw(); say('已套用自動建議，請再對照確認'); } };
$('#big').addEventListener('click',e=>{
  if(!picking) return; const p=e.target.closest('path[data-i]'); if(!p) return;
  const i=+p.dataset.i; if(picked.includes(i)) return;
  picked.push(i);
  if(picked.length===base.s.length){ order=picked.slice(); picking=false; say('順序排好了，請對照右邊確認'); }
  draw();
});
$('#save').onclick=()=>{
  if(!base) return;
  custom[ch]=cur(); store(); renderSaved(); syncBtns();
  say('「'+ch+'」已加入寫字本');
};
$('#del').onclick=()=>{ if(!custom[ch]) return; if(!confirm('要刪除「'+ch+'」的自製筆順嗎？')) return; delete custom[ch]; store(); renderSaved(); open(ch); };
$('#dl').onclick=()=>{
  const all=Object.assign({},fileCustom,custom);
  const txt='// 由「筆順製作」頁下載的自製筆順資料，直接取代這個檔案即可\nwindow.CUSTOM_SD='+JSON.stringify(all)+';\n';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/javascript'})); a.download='custom.js';
  document.body.appendChild(a); a.click(); a.remove(); say('已下載 custom.js（共 '+Object.keys(all).length+' 個字）');
};
renderSaved(); draw();
const q=new URLSearchParams(location.search).get('ch'); if(q) open(q);
})();
</script>
